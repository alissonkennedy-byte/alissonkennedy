name: QA do currículo de eventos (pré-publicação)
on:
  push:
    branches:
      - qa-eventos-2026-11-09
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.55.0 lighthouse@12
          npx playwright install --with-deps chromium
      - name: Build static site
        run: npm run build
      - name: Verify HTML exists in dist
        run: |
          test -s dist/index.html
          grep -q 'Alisson Kennedy' dist/index.html
          grep -q 'Festa junina' dist/index.html
      - name: Start test server
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/site-server.log 2>&1 &
          sleep 3
          curl -fsS http://127.0.0.1:4173/ >/dev/null
      - name: Browser checks + screenshots
        continue-on-error: true
        run: node qa-eventos.cjs
      - name: Lighthouse mobile
        continue-on-error: true
        run: |
          CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          npx lighthouse http://127.0.0.1:4173/ --chrome-path="$CHROME_PATH" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=qa-results/lighthouse-mobile.json --only-categories=performance,accessibility,best-practices,seo --quiet
      - name: Lighthouse desktop
        continue-on-error: true
        run: |
          CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          npx lighthouse http://127.0.0.1:4173/ --preset=desktop --chrome-path="$CHROME_PATH" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=qa-results/lighthouse-desktop.json --only-categories=performance,accessibility,best-practices,seo --quiet
      - name: Display scores
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const t of ['mobile','desktop']){
            try{
              const a=JSON.parse(fs.readFileSync('qa-results/lighthouse-'+t+'.json'));
              console.log(t,JSON.stringify({scores:Object.fromEntries(Object.entries(a.categories).map(([k,v])=>[k,Math.round(v.score*100)])),lcp:a.audits['largest-contentful-paint']?.numericValue,cls:a.audits['cumulative-layout-shift']?.numericValue}));
            } catch(e){console.log('Lighthouse '+t+' indisponível: '+e.message)}
          }
          NODE
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-eventos-evidencias
          path: qa-results/
          retention-days: 7
